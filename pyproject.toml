[project]
name = "relisted"
version = "0.1.0"
description = "Match US recall photos to store listings with SerpApi Google Lens, and search the names on Google Shopping India."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "serpapi>=0.1.5",
    "pillow>=10.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx2>=2.0"]

[project.scripts]
relisted = "relisted.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["relisted"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
